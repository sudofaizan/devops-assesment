name: Docker Image CI

on:
  push:
    branches: [ "master" ]
  pull_request:
    branches: [ "master" ]

jobs:
  build-push:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: getsha  
        run: echo "${GITHUB_SHA::7}" >gitsha
      - name: Build the Docker image
        run: bash quazictl build --docker
      - name: Docker Login
        run: echo "${{ secrets.DOCKER_PASSWORD }}" | docker login -u ${{ secrets.DOCKER_USERNAME }} --password-stdin
      - name: Push Docker image
        run: bash quazictl push
  Run:
    runs-on: ubuntu-latest
    needs: build-push
    steps:
      - uses: actions/checkout@v4
      - name: Test
        run: bash quazictl test_docker 
  Run-compose:
    runs-on: ubuntu-latest
    needs: Run
    steps:
      - uses: actions/checkout@v4
      - name: getsha  
        run: echo "SHORT_SHA=${GITHUB_SHA::7}" >gitsha
      - name: get-compose
        run: curl -L "https://github.com/docker/compose/releases/download/1.29.2/docker-compose-$(uname -s)-$(uname -m)" -o /usr/local/bin/docker-compose && chmod +x /usr/local/bin/docker-compose
      - name: Test-compose
        run: bash quazictl test_docker_compose

      